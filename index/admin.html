<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة تحكم - إدارة الوحدات</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      direction: rtl;
      background-color: #f5f5f5;
      padding: 20px;
    }

    header {
      background-color: #8b5e3c;
      color: white;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    section, form {
      background: white;
      padding: 20px;
      max-width: 450px;
      margin: 20px auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      background-color: #8b5e3c;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
    }

    button:hover {
      background-color: #6b442c;
    }

    .danger {
      background-color: #b91c1c;
    }

    .danger:hover {
      background-color: #7f1d1d;
    }

    .message {
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
    }

    .unit-item {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 15px;
      border-radius: 5px;
    }

    .unit-item button {
      width: auto;
      margin: 5px 5px 0 0;
      padding: 5px 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>لوحة التحكم</h1>
</header>

<!-- 🔴 إيقاف الحجز -->
<section>
  <h3>إيقاف الحجز مؤقتًا</h3>

  <label>من تاريخ</label>
  <input type="date" id="stopFrom">

  <label>إلى تاريخ</label>
  <input type="date" id="stopTo">

  <button onclick="saveStopBooking()">حفظ فترة الإيقاف</button>
  <button class="danger" onclick="enableBooking()">إعادة تفعيل الحجز</button>

  <div class="message" id="stopMessage"></div>
</section>

<!-- 🟢 إضافة / تعديل الوحدات -->
<form id="addUnitForm">
  <label>عنوان الوحدة</label>
  <input type="text" id="title" required>

  <label>وصف الوحدة</label>
  <textarea id="description" required></textarea>

  <label>السعر (ريال / الليلة)</label>
  <input type="number" id="price" required min="1">

  <label>عدد الأفراد</label>
  <input type="number" id="capacity" required min="1">

  <label>رابط صورة 1</label>
  <input type="url" id="image1" required>

  <label>رابط صورة 2</label>
  <input type="url" id="image2" required>

  <button type="submit">إضافة الوحدة</button>
  <button type="button" class="danger" id="cancelEdit" style="display:none">إلغاء التعديل</button>

  <div class="message" id="message"></div>
</form>

<div id="unitsList"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getDatabase, ref, push, set, onValue, remove, update, get
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCvwx3I0gb6UTACYawsaMvYvK0AOCEYgzs",
    authDomain: "booking-3878a.firebaseapp.com",
    databaseURL: "https://booking-3878a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "booking-3878a",
    storageBucket: "booking-3878a.appspot.com",
    messagingSenderId: "611114717520",
    appId: "1:611114717520:web:4768cb8a7b8465f99fdc55"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  /* 🔴 إيقاف الحجز */
  const bookingRef = ref(db, "settings/booking");

  window.saveStopBooking = async () => {
    const from = stopFrom.value;
    const to = stopTo.value;

    if (!from || !to) return alert("حدد فترة الإيقاف");

    await set(bookingRef, { stopped: true, from, to });
    stopMessage.textContent = "تم إيقاف الحجز";
    stopMessage.style.color = "green";
  };

  window.enableBooking = async () => {
    await set(bookingRef, { stopped: false });
    stopMessage.textContent = "تم تفعيل الحجز";
    stopMessage.style.color = "green";
  };

  /* 🟢 الوحدات */
  const unitsRef = ref(db, "units");
  const form = document.getElementById("addUnitForm");
  const message = document.getElementById("message");
  const unitsList = document.getElementById("unitsList");
  const cancelEdit = document.getElementById("cancelEdit");

  let editId = null;

  onValue(unitsRef, (snapshot) => {
    unitsList.innerHTML = "";
    if (!snapshot.exists()) return;

    const units = snapshot.val();
    for (const id in units) {
      const u = units[id];
      unitsList.innerHTML += `
        <div class="unit-item">
          <h4>${u.title}</h4>
          <p>${u.description}</p>
          <p>السعر: ${u.price} ريال</p>
          <button onclick="editUnit('${id}')">تعديل</button>
          <button class="danger" onclick="deleteUnit('${id}')">حذف</button>
        </div>
      `;
    }
  });

  window.editUnit = async (id) => {
    const snap = await get(ref(db, "units/" + id));
    if (!snap.exists()) return;

    const u = snap.val();
    title.value = u.title;
    description.value = u.description;
    price.value = u.price;
    capacity.value = u.capacity;
    image1.value = u.images?.[0] || "";
    image2.value = u.images?.[1] || "";

    editId = id;
    form.querySelector("button").textContent = "حفظ التعديل";
    cancelEdit.style.display = "block";

    message.textContent = "وضع التعديل مفعل";
    message.style.color = "orange";
  };

  cancelEdit.onclick = () => {
    editId = null;
    form.reset();
    form.querySelector("button").textContent = "إضافة الوحدة";
    cancelEdit.style.display = "none";
    message.textContent = "";
  };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
      title: title.value,
      description: description.value,
      price: price.value,
      capacity: capacity.value,
      images: [image1.value, image2.value],
      updatedAt: Date.now()
    };

    if (editId) {
      await update(ref(db, "units/" + editId), data);
      message.textContent = "تم تعديل الوحدة بنجاح";
    } else {
      await push(unitsRef, { ...data, createdAt: Date.now() });
      message.textContent = "تمت الإضافة بنجاح";
    }

    message.style.color = "green";
    form.reset();
    editId = null;
    cancelEdit.style.display = "none";
    form.querySelector("button").textContent = "إضافة الوحدة";
  });

  window.deleteUnit = async (id) => {
    if (!confirm("متأكد من الحذف؟")) return;
    await remove(ref(db, "units/" + id));
  };
</script>

</body>
</html>
